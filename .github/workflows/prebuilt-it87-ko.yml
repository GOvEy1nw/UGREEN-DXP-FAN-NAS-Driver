name: Build Prebuilt it87.ko

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Target kernel release (uname -r), e.g. 6.18.38-Unraid'
        required: true
        default: '6.18.38-Unraid'
      kernel_headers_url:
        description: 'URL to a tar/tar.gz/tar.xz/txz archive containing a prepared kernel build tree'
        required: true
      kernel_build_path:
        description: 'Optional path inside extracted archive to kernel build dir (contains top-level Makefile)'
        required: false
        default: ''
      build_mode:
        description: 'Module build mode'
        required: true
        type: choice
        options:
          - prod
          - dev
        default: prod

permissions:
  contents: read

jobs:
  build:
    # Keep the runner stable; Ubuntu 24.04 provides gcc-14.
    runs-on: ubuntu-24.04
    env:
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
      HEADERS_URL: ${{ github.event.inputs.kernel_headers_url }}
      KERNEL_BUILD_PATH_INPUT: ${{ github.event.inputs.kernel_build_path }}
      BUILD_MODE: ${{ github.event.inputs.build_mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            kmod \
            python3 \
            xz-utils

      - name: Download and extract kernel headers
        id: headers
        run: |
          set -euo pipefail
          WORKDIR="$RUNNER_TEMP/kernel-headers"
          ARCHIVE="$WORKDIR/headers.pkg"
          EXTRACTED="$WORKDIR/extracted"
          mkdir -p "$WORKDIR" "$EXTRACTED"

          validate_headers_url() {
            local url="$1"
            python3 - "$url" <<'PY'
          import ipaddress
          import socket
          import sys
          import urllib.parse

          url = sys.argv[1]
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https":
              raise SystemExit("Only https:// URLs are allowed for kernel_headers_url.")
          if not parsed.hostname:
              raise SystemExit("Could not parse host from kernel_headers_url.")
          host = parsed.hostname
          port = parsed.port or 443
          if host == "localhost" or host.endswith(".localhost"):
              raise SystemExit("Localhost targets are not allowed for kernel_headers_url.")

          try:
              infos = socket.getaddrinfo(host, port, proto=socket.IPPROTO_TCP)
          except socket.gaierror as exc:
              raise SystemExit(f"Could not resolve host '{host}': {exc}") from exc

          ips = {info[4][0] for info in infos}
          if not ips:
              raise SystemExit(f"Could not resolve host '{host}'.")
          global_ips = []
          for ip in ips:
              addr = ipaddress.ip_address(ip)
              if addr.is_global:
                  global_ips.append(ip)
          if not global_ips:
              raise SystemExit(f"kernel_headers_url resolved only to non-global addresses, rejecting.")
          print(f"{host}\t{port}\t{','.join(sorted(global_ips))}")
          PY
          }

          extract_archive_safely() {
            local archive="$1"
            local output_dir="$2"
            python3 - "$archive" "$output_dir" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = sys.argv[1]
          output_dir = sys.argv[2]

          # Require the standard-library extraction filter; never silently
          # fall back to unrestricted extraction on an older Python runtime.
          if not hasattr(tarfile, "data_filter"):
              raise SystemExit(
                  "Safe extraction requires a Python runtime with tarfile.data_filter "
                  "(Python 3.12+ or a supported backport)."
              )

          def kernel_member_filter(member, destination):
              # Keep the existing restriction on archive entry names.
              member_path = pathlib.PurePosixPath(member.name)
              if member_path.is_absolute() or ".." in member_path.parts:
                  raise tarfile.FilterError(f"Unsafe archive entry path: {member.name}")

              # Allow internal symlinks/hardlinks, including relative '../'
              # link targets that remain inside the extraction directory.
              # Validate each entry at extraction time so previously created
              # symlinks are taken into account. Reject absolute/outside links,
              # path escapes, devices and FIFOs; remove unsafe metadata.
              return tarfile.data_filter(member, destination)

          try:
              with tarfile.open(archive, "r:*", errorlevel=2) as tf:
                  tf.extractall(path=output_dir, filter=kernel_member_filter)
          except (tarfile.TarError, OSError, ValueError) as exc:
              raise SystemExit(f"Kernel archive extraction failed: {exc}") from exc

          print("Kernel archive extracted with internal-link safety checks.")
          PY
          }

          IFS=$'\t' read -r RESOLVED_HOST RESOLVED_PORT RESOLVED_IPS <<< "$(validate_headers_url "$HEADERS_URL")"
          IFS=',' read -r -a RESOLVED_IP_ARRAY <<< "$RESOLVED_IPS"
          downloaded=0
          for resolved_ip in "${RESOLVED_IP_ARRAY[@]}"; do
            http_code_probe="$(HTTPS_PROXY= HTTP_PROXY= ALL_PROXY= NO_PROXY= https_proxy= http_proxy= all_proxy= no_proxy= \
              curl -sS --proto '=https' --max-redirs 0 \
              --connect-to "${RESOLVED_HOST}:${RESOLVED_PORT}:${resolved_ip}:${RESOLVED_PORT}" \
              --write-out '%{http_code}' \
              --output /dev/null \
              "$HEADERS_URL" || true)"
            if [[ "$http_code_probe" =~ ^3 ]]; then
              echo "Redirect responses are not allowed for kernel_headers_url." >&2
              exit 1
            fi
            if [[ ! "$http_code_probe" =~ ^2 ]]; then
              continue
            fi

            http_code_download="$(HTTPS_PROXY= HTTP_PROXY= ALL_PROXY= NO_PROXY= https_proxy= http_proxy= all_proxy= no_proxy= \
              curl -sS --proto '=https' --max-redirs 0 \
              --connect-to "${RESOLVED_HOST}:${RESOLVED_PORT}:${resolved_ip}:${RESOLVED_PORT}" \
              --write-out '%{http_code}' \
              --output "$ARCHIVE" \
              "$HEADERS_URL" || true)"
            if [[ "$http_code_download" =~ ^2 ]]; then
              downloaded=1
              break
            fi
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "Failed to download kernel headers from validated global addresses." >&2
            exit 1
          fi
          extract_archive_safely "$ARCHIVE" "$EXTRACTED"

          resolve_kernel_build_dir() {
            local base="$1"
            local requested="${2:-}"
            is_valid_kernel_build_dir() {
              local dir="$1"
              [ -d "$dir" ] &&
              [ -f "$dir/Makefile" ] &&
              [ -d "$dir/include/linux" ] &&
              [ -f "$dir/Kconfig" ] &&
              [ -d "$dir/scripts" ]
            }

            if [ -n "$requested" ]; then
              if is_valid_kernel_build_dir "$base/$requested"; then
                echo "$base/$requested"
                return 0
              fi
              echo "kernel_build_path '$requested' is not a valid kernel build directory" >&2
              return 1
            fi

            local quick_candidate
            for quick_candidate in \
              "$base" \
              "$base/linux" \
              "$base/kernel" \
              "$base/linux-$KERNEL_VERSION"; do
              if is_valid_kernel_build_dir "$quick_candidate"; then
                echo "$quick_candidate"
                return 0
              fi
            done

            local include_linux_dir candidate
            while IFS= read -r include_linux_dir; do
              candidate="${include_linux_dir%/include/linux}"
              if is_valid_kernel_build_dir "$candidate"; then
                echo "$candidate"
                return 0
              fi
            done < <(find "$base" -maxdepth 8 -type d -path '*/include/linux' | sort -u || true)

            return 1
          }

          KBUILD_DIR="$(resolve_kernel_build_dir "$EXTRACTED" "$KERNEL_BUILD_PATH_INPUT")"
          if [ -z "$KBUILD_DIR" ]; then
            echo "Could not locate a usable kernel build directory in downloaded headers." >&2
            echo "Provide kernel_build_path explicitly (path relative to archive root)." >&2
            exit 1
          fi

          required_files=(
            "$KBUILD_DIR/Makefile"
            "$KBUILD_DIR/include/config/auto.conf"
            "$KBUILD_DIR/include/generated/autoconf.h"
            "$KBUILD_DIR/include/generated/utsrelease.h"
            "$KBUILD_DIR/scripts/Makefile.build"
          )
          for required_file in "${required_files[@]}"; do
            if [ ! -e "$required_file" ]; then
              echo "Kernel build tree is not prepared: missing $required_file" >&2
              echo "Provide an archive from a prepared tree (e.g. after modules_prepare)." >&2
              exit 1
            fi
          done

          echo "kbuild_dir=$KBUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "headers_root=$EXTRACTED" >> "$GITHUB_OUTPUT"

      - name: Build it87.ko
        env:
          KBUILD_DIR: ${{ steps.headers.outputs.kbuild_dir }}
        run: |
          set -euo pipefail

          # Unraid 6.18.38 was built with GCC 14.2.0. Use GCC 14 explicitly;
          # do not fall back to the runner's unversioned gcc (GCC 13).
          CC_BIN="gcc-14"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$CC_BIN"

          command -v "$CC_BIN" >/dev/null 2>&1 || {
            echo "Required compiler $CC_BIN is not available on runner." >&2
            exit 1
          }
          CC_VERSION="$("$CC_BIN" -dumpfullversion -dumpversion)"
          if [[ "${CC_VERSION%%.*}" != "14" ]]; then
            echo "Expected GCC 14, but $CC_BIN reports $CC_VERSION." >&2
            exit 1
          fi
          echo "Selected compiler: $CC_BIN ($CC_VERSION)"
          "$CC_BIN" --version

          # Verify the exact option that GCC 13 rejected before invoking kbuild.
          printf 'int compiler_probe(void) { return 0; }\n' | \
            "$CC_BIN" -Werror -fmin-function-alignment=16 \
              -x c -c -o /dev/null -

          # Check the archive's actual release, not only the workflow input.
          HEADER_RELEASE="$(awk -F'"' '/^#define UTS_RELEASE / {print $2}' \
            "$KBUILD_DIR/include/generated/utsrelease.h")"
          if [[ "$HEADER_RELEASE" != "$KERNEL_VERSION" ]]; then
            echo "Kernel mismatch: archive=$HEADER_RELEASE requested=$KERNEL_VERSION" >&2
            exit 1
          fi

          # Command-line variables propagate through the driver's recursive make.
          # The clean step must also target the downloaded Unraid build tree,
          # rather than whatever kernel happens to be running on GitHub.
          MAKE_ARGS=(
            "TARGET=$KERNEL_VERSION"
            "KERNEL_BUILD=$KBUILD_DIR"
            "CC=$CC_BIN"
            "HOSTCC=$CC_BIN"
            "BUILD=$BUILD_MODE"
          )
          make -C it87 "${MAKE_ARGS[@]}" clean
          make -C it87 "${MAKE_ARGS[@]}"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$OUT_DIR"
          cp it87/it87.ko "$OUT_DIR/"
          gcc-14 --version > "$OUT_DIR/compiler-version.txt"
          if ! modinfo "$OUT_DIR/it87.ko" > "$OUT_DIR/modinfo.txt" 2>"$OUT_DIR/modinfo.err"; then
            {
              echo "modinfo failed for the produced module."
              echo ""
              echo "modinfo stderr:"
              cat "$OUT_DIR/modinfo.err"
              echo ""
              echo "File type:"
              file "$OUT_DIR/it87.ko"
            } > "$OUT_DIR/modinfo.txt"
          fi
          rm -f "$OUT_DIR/modinfo.err"
          printf '%s\n' "$KERNEL_VERSION" > "$OUT_DIR/kernel-version.txt"
          printf '%s\n' "${{ steps.headers.outputs.kbuild_dir }}" > "$OUT_DIR/kernel-build-dir.txt"
          sha256sum "$OUT_DIR/it87.ko" > "$OUT_DIR/it87.ko.sha256"
          ls -lah "$OUT_DIR"

      - name: Upload prebuilt module
        uses: actions/upload-artifact@v4
        with:
          name: it87-ko-${{ github.event.inputs.kernel_version }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
